name: Temporary DevOps lockfile bootstrap
# Temporary branch-only workflow. Deleted after generating and reviewing package-lock.json.
on:
  push:
    branches:
      - chore/devops-lockfile-audit-20261021

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.repository == 'lstkr/projeto-gpt'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated DevOps branch
        uses: actions/checkout@v4
      - name: Node.js 22 and npm 10
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate package-lock.json without dependency lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify the lockfile reproduces the dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Report audit findings without exposing credentials
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log('AUDIT_SUMMARY_BEGIN');
          console.log(JSON.stringify({
            totals: report.metadata?.vulnerabilities || {},
            vulnerablePackages: Object.entries(report.vulnerabilities || {}).map(([name, value]) => ({
              name,
              severity: value.severity,
              isDirect: value.isDirect,
              range: value.range,
              via: (value.via || []).map(v => typeof v === 'string' ? v : ({
                name: v.name, title: v.title, url: v.url, range: v.range, severity: v.severity
              })),
              fixAvailable: value.fixAvailable
            }))
          }, null, 2));
          console.log('AUDIT_SUMMARY_END');
          NODE
      - name: Commit generated lockfile to the isolated DevOps branch
        run: |
          test "$GITHUB_REF_NAME" = "chore/devops-lockfile-audit-20261021"
          git add package-lock.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: add npm lockfile for reproducible installs"
          git push origin HEAD:"$GITHUB_REF_NAME"
