name: Security Red Team (commit gate)
# Every PUSHED commit receives a new audit run, including feature branches.
# Do not use concurrency cancellation: pending commits also deserve an audit.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key
  NEXT_PUBLIC_SUPABASE_PREVIEW_URL: https://ci-placeholder.supabase.co

jobs:
  adversarial-node:
    name: Adversarial auth / API / regression
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout untrusted commit with no persisted token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependency graph without install hooks
        run: npm ci --ignore-scripts
      - name: Fail on high/critical dependency advisories
        run: npm audit --audit-level=high
      - name: Adversarial session fuzzing and policy regression
        run: node --test tests/security-adversarial.test.cjs
      - name: Full Node regression (includes authorization and fiscal contract tests)
        run: npm test
      - name: Scan successful SHA summary
        if: success()
        run: echo "Adversarial Node checks passed for commit ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"

  supply-chain:
    name: Vulnerabilities, secrets and configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # O instalador setup-trivy depende de get.trivy.dev, indisponível por DNS.
      # Preserva a versão atual e verifica o SHA-256 oficial antes de executar.
      - name: Install Trivy
        env:
          TRIVY_VERSION: '0.70.0'
          TRIVY_SHA256: '8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trivy.tar.gz"
          install_dir="$RUNNER_TEMP/trivy-bin"
          curl --fail --show-error --location --retry 2 --connect-timeout 10 --max-time 120 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "$archive"
          echo "$TRIVY_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" trivy
          "$install_dir/trivy" --version
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Trivy filesystem audit (fail for HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: 'true'
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'table'
          cache: 'false'

  persistence-attack-lab:
    name: PostgreSQL attack lab / ${{ matrix.suite.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: session
            script: tests/sql/run-session-tests.py
          - name: fiscal
            script: tests/sql/run-fiscal-integrity.py
          - name: multi-tenant
            script: tests/sql/run-tenant-access.py
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: estoque_rpc_test_security
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-test-only
      PGDATABASE: estoque_rpc_test_security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Execute negative, concurrency and rollback cases in disposable database only
        run: python3 "${{ matrix.suite.script }}"
