name: Security Red Team (commit gate)
# Every PUSHED commit receives a new audit run, including feature branches.
# Do not use concurrency cancellation: pending commits also deserve an audit.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-node:
    name: Adversarial auth / API / regression
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout untrusted commit with no persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependency graph without install hooks
        run: npm ci --ignore-scripts
      - name: Fail on high/critical dependency advisories
        run: npm audit --audit-level=high
      - name: Adversarial session fuzzing and policy regression
        run: node --test tests/security-adversarial.test.cjs
      - name: Full Node regression (includes authorization and fiscal contract tests)
        run: npm test
      - name: Scan successful SHA summary
        if: success()
        run: echo "Adversarial Node checks passed for commit ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"

  supply-chain:
    name: Vulnerabilities, secrets and configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Trivy filesystem audit (fail for HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'table'
          cache: 'false'

  persistence-attack-lab:
    name: PostgreSQL attack lab / ${{ matrix.suite.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: session
            script: tests/sql/run-session-tests.py
          - name: fiscal
            script: tests/sql/run-fiscal-integrity.py
          - name: multi-tenant
            script: tests/sql/run-tenant-access.py
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: estoque_rpc_test_security
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-test-only
      PGDATABASE: estoque_rpc_test_security
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Execute negative, concurrency and rollback cases in disposable database only
        run: python3 "${{ matrix.suite.script }}"
