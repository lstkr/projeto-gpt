name: Migrations-only baseline replay
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node scripts/build-sql-baseline.cjs --check
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VERCEL: '1'
          VERCEL_ENV: preview
          NEXT_PUBLIC_SUPABASE_URL: https://cifixture.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder-not-a-key
          ESTOQUE_SUPABASE_ALLOWED_REF: cifixture
  replay:
    name: Baseline and security / PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: estoque_rpc_test_baseline
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-test-only
      PGDATABASE: estoque_rpc_test_baseline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Replay baseline, migrations, catalog contract and negative security tests
        run: python3 tests/sql/run-baseline-replay.py
