name: Native session RPC tests
on:
  pull_request:
  push:
    branches: ['database/session-rpc-27']
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ['15', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: estoque_rpc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-test-only
      PGDATABASE: estoque_rpc_test
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/sql/run-session-tests.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
