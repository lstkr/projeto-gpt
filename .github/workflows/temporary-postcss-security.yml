name: Temporary PostCSS lockfile bootstrap
# Isolated branch only; delete before the security PR is reviewed.
on:
  push:
    branches: [fix/postcss-security-20261021]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.repository == 'lstkr/projeto-gpt'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Re-resolve PostCSS override and install locked dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "const p=require('postcss/package.json'); console.log('POSTCSS_PATCHED_VERSION='+p.version); if(p.version!=='8.5.23')process.exit(1)"
      - name: Audit installed transitive dependencies without masking results
        run: |
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          node - "$RUNNER_TEMP/audit.json" <<'NODE'
          const fs=require('node:fs');
          const result=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log('POSTCSS_AUDIT_COUNTS='+JSON.stringify(result.metadata?.vulnerabilities||{}));
          console.log('POSTCSS_AUDIT_PACKAGES='+Object.keys(result.vulnerabilities||{}).join(','));
          NODE
      - name: Commit isolated branch lockfile
        run: |
          test "$GITHUB_REF_NAME" = "fix/postcss-security-20261021"
          git add package-lock.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: resolve PostCSS security override"
          git push origin HEAD:"$GITHUB_REF_NAME"
