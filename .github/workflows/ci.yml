name: Build check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No committed lockfile yet; move to npm ci after introducing one.
      - name: Install dependencies
        run: npm install
      # package.json runs tests before next build; retain this gate.
      - name: Build Next.js app
        run: npm run build
