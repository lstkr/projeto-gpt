name: Production read-only smoke
on:
  pull_request:
    paths:
      - 'scripts/smoke-production.cjs'
      - '.github/workflows/production-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check public production assets and reject unauthenticated operations
        env:
          ESTOQUE_SMOKE_URL: https://projetogpt-estoque.vercel.app
        run: node scripts/smoke-production.cjs
