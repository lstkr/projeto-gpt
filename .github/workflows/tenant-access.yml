name: Tenant access and recovery acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  bootstrap-tool:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts && npm audit --audit-level=high && node --check bootstrap.mjs
        working-directory: scripts/admin
  postgres:
    name: Tenant isolation / PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: estoque_rpc_test_tenant
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-test-only
      PGDATABASE: estoque_rpc_test_tenant
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Isolation, roles, first password, concurrency and recovery
        run: python3 tests/sql/run-tenant-access.py
      - name: Receipt upload identity and concurrent retries
        env:
          PGDATABASE: estoque_rpc_test_upload
        run: |
          createdb estoque_rpc_test_upload
          python3 -B tests/sql/run-receipt-upload.py
