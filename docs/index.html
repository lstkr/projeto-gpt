<div id="root"><div class="gate"><section class="gate-card"><div class="brand"><div class="logo">▦</div><div><strong>estoque<span>+</span></strong><small>CAFETERIA</small></div></div><h1>Carregando estoque…</h1><p>Conectando ao banco compartilhado da equipe.</p></section></div></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { supabaseConfig } from './supabase-runtime-config.mjs';
const { url: SUPABASE_URL, publicKey: SUPABASE_KEY } = supabaseConfig;
const db=createClient(SUPABASE_URL,SUPABASE_KEY);
const root=document.getElementById('root');
const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n||0));
const qty=n=>new Intl.NumberFormat('pt-BR',{maximumFractionDigits:3}).format(Number(n||0));
const norm=s=>String(s||'').trim().toLocaleLowerCase('pt-BR');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const low=p=>Number(p.stock||0)<=Number(p.min||0);
const dateNow=()=>new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date());
let code='',currentUser=null,state={products:[],movements:[],documents:[]},view='stock',search='',category='Todas',status='Todos',draft=null,modal=null,toastTimer=null,saveTimer=null,saving=false,saveError=false,loading=false;
try{sessionStorage.removeItem('projeto-gpt-access');code=sessionStorage.getItem('projeto-gpt-session')||''}catch{}
function showToast(message){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.textContent=message;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},3500)}
async function loadState(sessionToken){const r=await db.rpc('inventory_get',{p_session_token:sessionToken});if(r.error||!r.data)throw Error('Sua sessão expirou ou não é válida. Entre novamente com seu login e senha.');const d=r.data;state={products:Array.isArray(d.products)?d.products:[],movements:Array.isArray(d.movements)?d.movements:[],documents:Array.isArray(d.documents)?d.documents:[]};currentUser=d.user||null;code=sessionToken;try{sessionStorage.setItem('projeto-gpt-session',code);sessionStorage.removeItem('projeto-gpt-access')}catch{}}
function queueSave(){if(!code)return;saving=true;saveError=false;const s=document.getElementById('saveStatus');if(s)s.textContent='Salvando…';clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{const snap=JSON.parse(JSON.stringify(state));const r=await db.rpc('inventory_save',{p_session_token:code,p_state:snap});saving=false;saveError=Boolean(r.error);const el=document.getElementById('saveStatus');if(el)el.textContent=r.error?'Falha ao salvar':'Sincronizado';if(r.error)showToast('Erro ao salvar no banco. Não feche a página até confirmar a conexão.');},600)}
function goGate(message){
 try{sessionStorage.removeItem('projeto-gpt-session');sessionStorage.removeItem('projeto-gpt-access')}catch{}
 code='';currentUser=null;
 root.innerHTML='<div class="gate"><section class="gate-card"><div class="brand"><div class="logo">▦</div><div><strong>estoque<span>+</span></strong><small>CAFETERIA</small></div></div><h1>Entrar no estoque</h1><p>Use sua conta individual da cafeteria para consultar e atualizar o estoque compartilhado.</p><form id="loginForm" style="display:grid;gap:11px"><div class="field"><label for="loginUsername">Login</label><input id="loginUsername" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required style="width:100%;height:42px;border:1px solid var(--line);border-radius:8px;padding:0 11px"></div><div class="field"><label for="loginPassword">Senha</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" required style="width:100%;height:42px;border:1px solid var(--line);border-radius:8px;padding:0 11px"></div><button class="btn primary" type="submit">Entrar no estoque</button></form>'+(message?'<div class="gate-error" role="status">'+esc(message)+'</div>':'')+'<div style="font-size:9px;color:#8e9a8f;border-top:1px solid #eef1ec;padding-top:15px;margin-top:19px;text-align:center">Sessão individual protegida, válida por até 12 horas.</div></section></div>';
 const form=root.querySelector('#loginForm');
 form?.addEventListener('submit',async event=>{
  event.preventDefault();
  const button=form.querySelector('button[type="submit"]');
  button.disabled=true;button.textContent='Verificando acesso…';
  const dataForm=new FormData(form);
  try{
   const result=await db.rpc('inventory_login',{p_username:String(dataForm.get('username')||'').trim().toLowerCase(),p_password:String(dataForm.get('password')||'')});
   if(result.error||!result.data?.ok||!result.data?.session_token){goGate(result.data?.message||'Login ou senha inválidos.');return}
   try{await loadState(result.data.session_token);render()}catch(error){goGate(error.message||'Não foi possível abrir o estoque.')}
  }catch{goGate('Não consegui conectar ao banco agora. Confira a conexão e tente novamente.')}
 });
}function pageInfo(){return view==='stock'?['VISÃO GERAL','Controle de estoque','Acompanhe ingredientes, embalagens e níveis mínimos.']:view==='documents'?['COMPRAS & ENTRADAS','Documentos fiscais','Revise manualmente os itens e registre quem conferiu cada nota.']:['RASTREABILIDADE','Movimentações','Consulte todas as entradas e saídas da cafeteria.']}
function render(){
 const lows=state.products.filter(low),totalValue=state.products.reduce((a,p)=>a+Number(p.stock||0)*Number(p.cost||0),0),totalQty=state.products.reduce((a,p)=>a+Number(p.stock||0),0);
 const cats=['Todas',...new Set(state.products.map(p=>p.category).filter(Boolean))];

function bind(){

 root.querySelector('#search')?.addEventListener('input',e=>{search=e.target.value;const pos=e.target.selectionStart;render();const n=root.querySelector('#search');n?.focus();if(n)n.setSelectionRange(pos,pos)});

 root.querySelector('#status')?.addEventListener('change',e=>{status=e.target.value;render()});
 root.querySelector('#fileInput')?.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)processFile(f);e.target.value=''});
 root.querySelector('#productForm')?.addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const edit=modal&&modal.editId;const item={id:edit||uid(),name:d.name.trim(),sku:d.sku.trim()||('PRD-'+Date.now().toString().slice(-5)),category:d.category,unit:d.unit,stock:Number(d.stock)||0,min:Number(d.min)||0,cost:Number(d.cost)||0,updated:dateNow()};if(edit){state.products=state.products.map(p=>p.id===edit?item:p);state.movements.unshift({id:uid(),product:item.name,type:'Ajuste',quantity:item.stock,reason:'Cadastro editado',date:dateNow(),by:d.by.trim()});showToast('Produto atualizado.')}else{state.products.unshift(item);state.movements.unshift({id:uid(),product:item.name,type:'Cadastro',quantity:item.stock,reason:'Cadastro inicial',date:dateNow(),by:d.by.trim()});showToast('Produto cadastrado.')}modal=null;draft=null;render();queueSave()});
 root.querySelector('#adjustForm')?.addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const p=state.products.find(x=>x.id===modal.id),amount=Number(d.quantity);if(!p||!(amount>0))return;const delta=d.type==='Saída'?-amount:amount;if(Number(p.stock)+delta<0){showToast('A saída não pode superar o saldo disponível.');return}p.stock=Math.round((Number(p.stock)+delta)*1000)/1000;p.updated=dateNow();state.movements.unshift({id:uid(),product:p.name,type:d.type,quantity:amount,reason:d.reason,date:dateNow(),by:d.by.trim()});modal=null;render();queueSave();showToast('Movimentação registrada.')});
 root.querySelector('#reviewForm')?.addEventListener('submit',e=>{e.preventDefault();confirmReview(new FormData(e.target))});
}
function onAction(act,d){
 if(act==='new'){draft={kind:'product',product:null};modal={kind:'product'};render()}
 if(act==='upload'){if(view!=='documents'){view='documents';render()}root.querySelector('#fileInput')?.click()}
 if(act==='edit'){draft={kind:'product',product:state.products.find(p=>p.id===d.id)};modal={kind:'product',editId:d.id};render()}
 if(act==='adjust'){modal={kind:'adjust',id:d.id};render()}
 if(act==='closemodal'){modal=null;draft=null;render()}
 if(act==='cancelreview'){modal=null;draft=null;render()}
 if(act==='low'){status='Baixo';view='stock';render()}
 if(act==='clearfilters'){search='';category='Todas';status='Todos';render()}
 if(act==='additem'&&draft){draft.items.push({name:'',quantity:1,unit:'un',unitPrice:0});modal='review';render()}
 if(act==='removeitem'&&draft){draft.items.splice(Number(d.index),1);render()}
 if(act==='detail'){modal={kind:'detail',id:d.id};render()}
 if(act==='lock'){const token=code;if(token)db.rpc('inventory_logout',{p_session_token:token}).catch(()=>{});try{sessionStorage.removeItem('projeto-gpt-session');sessionStorage.removeItem('projeto-gpt-access')}catch{};code='';goGate('Você saiu da sua conta. Entre novamente para acessar o estoque.')}
}

function parseXml(text,fileName){
 const doc=new DOMParser().parseFromString(text,'application/xml');if(doc.querySelector('parsererror'))throw Error('O arquivo não parece ser um XML de NF-e válido.');
 const els=Array.from(doc.getElementsByTagName('*')),find=(el,n)=>Array.from((el||doc).getElementsByTagName('*')).find(x=>x.localName===n)?.textContent?.trim()||'';
 const ide=els.find(x=>x.localName==='ide')||doc,emit=els.find(x=>x.localName==='emit')||doc;
 const items=els.filter(x=>x.localName==='det').map(det=>{const prod=Array.from(det.getElementsByTagName('*')).find(x=>x.localName==='prod');if(!prod)return null;return{name:find(prod,'xProd'),code:find(prod,'cProd'),quantity:localizedNumber(find(prod,'qCom'))||1,unit:find(prod,'uCom')||'un',unitPrice:localizedNumber(find(prod,'vUnCom'))||0}}).filter(it=>it&&it.name);
 if(!items.length)throw Error('Nenhum item encontrado no XML completo da NF-e.');return{supplier:find(emit,'xNome'),invoiceNumber:find(ide,'nNF'),date:find(ide,'dhEmi')||find(ide,'dEmi'),source:'XML de NF-e',fileName,checkedBy:'',items};
}
function parseReceipt(text){
 const rows=[],ignore=/(CNPJ|CPF|CUPOM FISCAL|DOCUMENTO AUXILIAR|CHAVE DE ACESSO|PROTOCOLO|SUBTOTAL|TOTAL A PAGAR|VALOR TOTAL|TRIBUTOS|ICMS|COFINS|PIS\b|TROCO|DESCONTO|DINHEIRO|CART[AÃ]O|CR[EÉ]DITO|D[EÉ]BITO|PIX\b|CONSUMIDOR|INSCRI[CÇ][AÃ]O ESTADUAL)/i;
 for(const line of String(text||'').split(/\r?\n/)){if(ignore.test(line))continue;const matches=line.match(/\d{1,3}(?:\.\d{3})*,\d{2,4}|\d+(?:[.,]\d{2,4})/g)||[];const vals=matches.map(localizedNumber).filter(n=>Number.isFinite(n)&&n>=0);if(!vals.length)continue;const total=vals[vals.length-1],unitPrice=vals.length>1?vals[vals.length-2]:total;const name=line.replace(/\d{1,3}(?:\.\d{3})*,\d{2,4}|\d+(?:[.,]\d{2,4})/g,' ').replace(/\b(?:UN|UND|KG|G|GR|LT|L|ML|CX|PC|PCT|FD)\b/gi,' ').replace(/^\s*(?:\d{1,6}\s+){1,3}/,'').replace(/\s+/g,' ').trim();if(name.length<3||ignore.test(name))continue;let quantity=unitPrice>0?Math.round((total/unitPrice)*1000)/1000:1;if(!Number.isFinite(quantity)||quantity<=0||quantity>10000)quantity=1;rows.push({name,code:'',quantity,unit:'un',unitPrice:unitPrice||total})}
 return rows.slice(0,50);
}
async function processFile(file){
 try{
  if(/\.xml$/i.test(file.name)||/xml/i.test(file.type)){draft=parseXml(await file.text(),file.name);modal='review';view='documents';render();return}
  if(file.type.startsWith('image/')||/\.(png|jpe?g|webp)$/i.test(file.name)){view='documents';modal=null;render();showToast('Reconhecendo texto da foto…');const {createWorker}=await import('https://cdn.jsdelivr.net/npm/tesseract.js@5/+esm');const worker=await createWorker('por');try{const res=await worker.recognize(file),items=parseReceipt(res.data.text||'');draft={supplier:'',invoiceNumber:'',date:'',source:'Foto (OCR experimental)',fileName:file.name,checkedBy:'',ocrText:res.data.text||'',items:items.length?items:[{name:'',quantity:1,unit:'un',unitPrice:0}]};modal='review';render();showToast(items.length?'OCR sugeriu linhas: confira com o cupom original.':'Texto lido; informe os itens manualmente.')}finally{await worker.terminate()}return}
  if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){draft={supplier:'',invoiceNumber:'',date:'',source:'PDF (preenchimento manual)',fileName:file.name,checkedBy:'',items:[{name:'',quantity:1,unit:'un',unitPrice:0}]};modal='review';view='documents';render();return}
  throw Error('Formato não aceito. Use XML, PDF, JPG, PNG ou WEBP.');
 }catch(err){showToast(err.message||'Não consegui abrir o arquivo.')}
}
function confirmReview(form){
 if(!draft)return;const checkedBy=String(form.get('checkedBy')||'').trim();if(!checkedBy){showToast('Informe quem conferiu a nota.');return}
 const items=draft.items.map((it,i)=>({...it,name:String(form.get('name-'+i)||'').trim(),quantity:Number(form.get('quantity-'+i)),unit:String(form.get('unit-'+i)||'un').trim(),unitPrice:Number(form.get('unitPrice-'+i))})).filter(it=>it.name&&Number.isFinite(it.quantity)&&it.quantity>0&&Number.isFinite(it.unitPrice)&&it.unitPrice>=0);
 if(!items.length){showToast('Informe ao menos um produto com quantidade e custo válidos.');return}
 const invoiceNo=String(form.get('invoiceNumber')||'').trim(),supplier=String(form.get('supplier')||'').trim();
 if(invoiceNo&&state.documents.some(d=>d.invoiceNumber===invoiceNo&&norm(d.supplier)===norm(supplier))&&!confirm('Já existe uma nota com esse número e fornecedor. Quer lançar novamente?'))return;
 for(const it of items){const p=state.products.find(x=>norm(x.name)===norm(it.name)&&norm(x.unit)===norm(it.unit));if(p){p.stock=Math.round((Number(p.stock)+it.quantity)*1000)/1000;if(it.unitPrice>0)p.cost=it.unitPrice;p.updated=dateNow()}else state.products.unshift({id:uid(),name:it.name,sku:it.code||('PRD-'+Date.now().toString().slice(-5)),category:'Outros',unit:it.unit||'un',stock:it.quantity,min:0,cost:it.unitPrice,updated:dateNow()});state.movements.unshift({id:uid(),product:it.name,type:'Entrada',quantity:it.quantity,reason:'Documento '+(invoiceNo?'#'+invoiceNo:'importado'),date:dateNow(),by:checkedBy})}
 const {ocrText,...documentFields}=draft;state.documents.unshift({...documentFields,id:uid(),supplier,invoiceNumber:invoiceNo,date:String(form.get('date')||'').trim(),checkedBy,items,status:'Conferido e lançado',importedAt:dateNow()});draft=null;modal=null;view='documents';render();queueSave();showToast('Entrada registrada após conferência.');
}
async function init(){
 if(!code){goGate('');return}
 try{await loadState(code);render()}catch(e){goGate(e.message)}
}
init();
